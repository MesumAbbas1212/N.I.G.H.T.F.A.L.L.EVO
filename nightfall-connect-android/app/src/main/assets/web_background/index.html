<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Quantum Core Resonator</title>
  <!-- Three.js + PostProcessing (UnrealBloomPass) + OrbitControls (Local Offline) -->
  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="EffectComposer.js"></script>
  <script src="RenderPass.js"></script>
  <script src="ShaderPass.js"></script>
  <script src="CopyShader.js"></script>
  <script src="LuminosityHighPassShader.js"></script>
  <script src="UnrealBloomPass.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020306;
      user-select: none;
      -webkit-user-select: none;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

  </style>
</head>
<body>
  <div id="webgl-canvas"></div>

  <script>
    // HARDCODED CONSTANTS FROM ORIGINAL background.html:
    // Wave Lobes: 4 | Wave Undulation Height: 0.75 | Core Vortex Speed: 0.7 | Bloom: 0.75
    const LOBES = 4;
    const AMPLITUDE = 0.75;
    const SPEED = 0.7;
    const BLOOM_STRENGTH = 0.75;
    const BLOOM_RADIUS = 0.35;
    const BLOOM_THRESHOLD = 0.75;

    let scene, camera, renderer, composer, bloomPass, controls;
    let mainGroup;
    let standingWaveLines = [], standingWaveParticles;
    let coreSingularity, vortexTendrilsGroup;
    let orbitalRingsGroup = [], starburstNodesGroup;
    let moonBokehMesh, spaceDustGroup;
    let glowSprite, spiralMat, outerLine;

    // ——— REACTIVE NIGHTFALL EVO STATE CONTROLLER ———
    let currentState = "IDLE";
    const STATE_COLORS = {
      LISTENING:  { hot: 0x80ffff, mid: 0x00e5ff, dim: 0x0088aa }, // Luminous Cyan
      SPEAKING:   { hot: 0xffffff, mid: 0xdff8ff, dim: 0x00e5ff }, // Brilliant White & Ice Cyan
      THINKING:   { hot: 0xffc080, mid: 0xff9100, dim: 0xcc6600 }, // Sunset Amber
      EXECUTING:  { hot: 0xd4a0ff, mid: 0x7c4dff, dim: 0x4a148c }, // Cyber Violet
      WORKING:    { hot: 0x00f0ff, mid: 0x0090ff, dim: 0x0040aa }, // Cyber Blue
      MUTED:      { hot: 0xff9999, mid: 0xff3b30, dim: 0x881111 }, // Crimson Red
      SCANNING:   { hot: 0xa0ffea, mid: 0x00f0ff, dim: 0x0088aa }, // Cyber Cyan Matrix
      ONLINE:     { hot: 0xffffff, mid: 0xebf5ff, dim: 0x00f0ff }, // NIGHTFALL Evo Quantum White & Cyber Cyan
      IDLE:       { hot: 0xffffff, mid: 0xebf5ff, dim: 0x00f0ff }, // NIGHTFALL Evo Quantum White & Cyber Cyan
    };

    let targetColorHot = new THREE.Color(0xffffff);
    let targetColorMid = new THREE.Color(0xebf5ff);
    let targetColorDim = new THREE.Color(0x90b5d8);

    let currentColorHot = new THREE.Color(0xffffff);
    let currentColorMid = new THREE.Color(0xebf5ff);
    let currentColorDim = new THREE.Color(0x90b5d8);

    let targetScale = 1.0;
    let currentScale = 1.0;

    let targetCameraZ = 46.0;
    let currentCameraZ = 46.0;

    let targetSpeedMult = 1.0;
    let currentSpeedMult = 1.0;

    let targetPulseMod = 1.0;
    let currentPulseMod = 1.0;

    // Reactivity & Audio
    let currentAudioLevel = 0.0;
    let targetAudioLevel = 0.0;
    let simTime = 0.0;
    let isCompactMode = false;
    let currentPositionX = 0.0;
    let targetPositionX = 0.0;

    const clock = new THREE.Clock();

    // CURSOR GAZE & SENTIENT TRACKING
    let mouseNormX = 0, mouseNormY = 0;
    let targetTiltX = 0, targetTiltY = 0;
    window.addEventListener("pointermove", (e) => {
      mouseNormX = (e.clientX / Math.max(1, window.innerWidth)) * 2 - 1;
      mouseNormY = -(e.clientY / Math.max(1, window.innerHeight)) * 2 + 1;
      targetTiltX = -mouseNormY * 0.22;
      targetTiltY = mouseNormX * 0.30;
    });

    function createGlowSpriteTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.18, 'rgba(230, 245, 255, 0.85)');
      grad.addColorStop(0.5, 'rgba(180, 220, 255, 0.25)');
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(canvas);
    }

    function createStarburstTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const cx = 128, cy = 128;

      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.15, 'rgba(225, 242, 255, 0.9)');
      grad.addColorStop(0.4, 'rgba(170, 215, 255, 0.18)');
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.lineWidth = 1.6;
      
      ctx.beginPath();
      ctx.moveTo(10, cy); ctx.lineTo(246, cy);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx, 10); ctx.lineTo(cx, 246);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(235, 245, 255, 0.35)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(45, 45); ctx.lineTo(211, 211);
      ctx.moveTo(211, 45); ctx.lineTo(45, 211);
      ctx.stroke();

      return new THREE.CanvasTexture(canvas);
    }

    function initScene() {
      const container = document.getElementById('webgl-canvas');
      const w = Math.max(window.innerWidth || 0, container ? container.clientWidth : 0, 800);
      const h = Math.max(window.innerHeight || 0, container ? container.clientHeight : 0, 600);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020306);

      // Camera: Field of View 38, positioned at z=46 for balanced desktop framing
      camera = new THREE.PerspectiveCamera(38, w / h, 0.1, 1000);
      camera.position.set(0, 0, 46);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.rotateSpeed = 0.5;
      controls.enablePan = false;
      controls.enableZoom = false;

      const renderPass = new THREE.RenderPass(scene, camera);
      bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(w, h),
        BLOOM_STRENGTH,
        BLOOM_RADIUS,
        BLOOM_THRESHOLD
      );

      composer = new THREE.EffectComposer(renderer);
      composer.addPass(renderPass);
      composer.addPass(bloomPass);

      mainGroup = new THREE.Group();
      scene.add(mainGroup);

      buildStandingWaveManifold();
      buildCentralVortexSingularity();
      buildGyroscopicOrbitalRings();
      buildStarburstNodes();
      buildReferenceMoonBokeh();
      buildAmbientDust();

      window.addEventListener('resize', onWindowResize);
    }

    function buildStandingWaveManifold() {
      const waveGroup = new THREE.Group();
      mainGroup.add(waveGroup);

      const lineCount = 92;
      const samples = 140;
      standingWaveLines = [];

      for (let i = 0; i < lineCount; i++) {
        const u = (i / (lineCount - 1)) * 2.0 - 1.0;
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(samples * 3);
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const alpha = Math.sin(Math.acos(Math.abs(u))) * 0.45 + 0.15;
        const mat = new THREE.LineBasicMaterial({
          color: 0xebf5ff,
          transparent: true,
          opacity: alpha,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });

        const line = new THREE.Line(geo, mat);
        waveGroup.add(line);
        standingWaveLines.push({ line, u });
      }

      const particleCount = 18000;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(particleCount * 3);
      const pSizes = new Float32Array(particleCount);

      for (let i = 0; i < particleCount; i++) {
        const theta = Math.random() * Math.PI * 2.0;
        const phi = Math.acos(2.0 * Math.random() - 1.0) - Math.PI * 0.5;

        pPos[i * 3 + 0] = theta;
        pPos[i * 3 + 1] = phi;
        pPos[i * 3 + 2] = Math.random();

        pSizes[i] = 1.0 + Math.random() * 2.2;
      }

      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      pGeo.setAttribute('size', new THREE.BufferAttribute(pSizes, 1));

      const pMat = new THREE.ShaderMaterial({
        uniforms: {
          time: { value: 0 },
          uLobes: { value: LOBES },
          uAmp: { value: AMPLITUDE },
          pointTex: { value: createGlowSpriteTexture() },
          uColorDim: { value: new THREE.Color(0xd9f0ff) },
          uColorHot: { value: new THREE.Color(0xffffff) }
        },
        vertexShader: `
          uniform float time;
          uniform float uLobes;
          uniform float uAmp;
          attribute float size;
          varying float vAlpha;
          varying float vDist;

          void main() {
            float theta = position.x;
            float phi = position.y;

            float harmonic = sin(uLobes * theta + time * 0.6) * cos(3.0 * phi);
            float crossHarmonic = sin(uLobes * 2.0 * theta - time * 0.4) * 0.25;
            float rBase = 6.2 + (harmonic + crossHarmonic) * 2.3 * uAmp;

            float twist = (1.0 - smoothstep(0.0, 7.0, rBase)) * 1.4;
            float effectiveTheta = theta + twist * sin(time * 0.5);

            vec3 pos;
            pos.x = rBase * cos(phi) * cos(effectiveTheta);
            pos.y = rBase * sin(phi) * 0.88;
            pos.z = rBase * cos(phi) * sin(effectiveTheta);

            vDist = length(pos);
            vAlpha = (0.2 + 0.8 * smoothstep(2.0, 8.0, vDist)) * (0.4 + 0.6 * sin(effectiveTheta * 4.0 + time));

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = size * (120.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          uniform sampler2D pointTex;
          uniform vec3 uColorDim;
          uniform vec3 uColorHot;
          varying float vAlpha;

          void main() {
            vec4 tex = texture2D(pointTex, gl_PointCoord);
            if (tex.a < 0.05) discard;
            vec3 col = mix(uColorDim, uColorHot, vAlpha);
            gl_FragColor = vec4(col, tex.a * vAlpha * 0.55);
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      standingWaveParticles = new THREE.Points(pGeo, pMat);
      waveGroup.add(standingWaveParticles);
    }

    function buildCentralVortexSingularity() {
      vortexTendrilsGroup = new THREE.Group();
      mainGroup.add(vortexTendrilsGroup);

      const coreGeo = new THREE.SphereGeometry(0.38, 32, 32);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      coreSingularity = new THREE.Mesh(coreGeo, coreMat);
      vortexTendrilsGroup.add(coreSingularity);

      const glowMat = new THREE.SpriteMaterial({
        map: createGlowSpriteTexture(),
        color: 0xeff8ff,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
      });
      glowSprite = new THREE.Sprite(glowMat);
      glowSprite.scale.set(3.2, 3.2, 1.0);
      vortexTendrilsGroup.add(glowSprite);

      const tendrilCount = 36;
      const tendrilPoints = 80;
      spiralMat = new THREE.LineBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.7,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      for (let t = 0; t < tendrilCount; t++) {
        const phiOffset = (t / tendrilCount) * Math.PI * 2.0;
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(tendrilPoints * 3);

        for (let p = 0; p < tendrilPoints; p++) {
          const frac = p / (tendrilPoints - 1);
          const r = Math.pow(frac, 1.35) * 3.4 + 0.25;
          const theta = phiOffset + frac * 4.2;
          const z = (Math.sin(theta * 2.0) * 0.4) * (1.0 - frac);

          pos[p * 3 + 0] = r * Math.cos(theta);
          pos[p * 3 + 1] = r * Math.sin(theta);
          pos[p * 3 + 2] = z;
        }

        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const line = new THREE.Line(geo, spiralMat);
        vortexTendrilsGroup.add(line);
      }
    }

    function buildGyroscopicOrbitalRings() {
      orbitalRingsGroup = [];

      const ringConfigs = [
        { rx: 8.6, ry: 7.2, rot: [0.35, 0.45, 0.12], speed: 0.18 },
        { rx: 9.0, ry: 6.8, rot: [-0.48, 0.75, -0.35], speed: -0.22 },
        { rx: 8.2, ry: 8.0, rot: [0.85, -0.32, 0.65], speed: 0.15 },
        { rx: 9.4, ry: 6.4, rot: [-0.72, -0.62, 0.25], speed: -0.19 },
        { rx: 8.8, ry: 7.6, rot: [0.15, -1.15, -0.75], speed: 0.24 },
        { rx: 7.9, ry: 7.9, rot: [-0.25, 1.35, 0.85], speed: -0.16 },
        { rx: 9.8, ry: 6.0, rot: [1.12, 0.58, -0.45], speed: 0.21 },
        { rx: 8.5, ry: 8.4, rot: [-0.95, 0.28, -0.85], speed: -0.17 }
      ];

      ringConfigs.forEach(cfg => {
        const segments = 160;
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(segments * 3);

        for (let i = 0; i < segments; i++) {
          const t = (i / (segments - 1)) * Math.PI * 2.0;
          pos[i * 3 + 0] = cfg.rx * Math.cos(t);
          pos[i * 3 + 1] = cfg.ry * Math.sin(t);
          pos[i * 3 + 2] = 0;
        }

        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

        const mat = new THREE.LineBasicMaterial({
          color: 0xf0f7ff,
          transparent: true,
          opacity: 0.55,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });

        const ringLine = new THREE.Line(geo, mat);
        ringLine.rotation.set(cfg.rot[0], cfg.rot[1], cfg.rot[2]);
        mainGroup.add(ringLine);

        orbitalRingsGroup.push({
          mesh: ringLine,
          rx: cfg.rx,
          ry: cfg.ry,
          rot: cfg.rot,
          speed: cfg.speed
        });
      });

      const outerGeo = new THREE.BufferGeometry();
      const outerPos = new Float32Array(200 * 3);
      for (let i = 0; i < 200; i++) {
        const t = (i / 199) * Math.PI * 2.0;
        outerPos[i * 3 + 0] = 10.6 * Math.cos(t);
        outerPos[i * 3 + 1] = 10.6 * Math.sin(t);
        outerPos[i * 3 + 2] = 0;
      }
      outerGeo.setAttribute('position', new THREE.BufferAttribute(outerPos, 3));
      outerLine = new THREE.Line(outerGeo, new THREE.LineBasicMaterial({
        color: 0x90b5d8,
        transparent: true,
        opacity: 0.18,
        blending: THREE.AdditiveBlending
      }));
      mainGroup.add(outerLine);
    }

    function buildStarburstNodes() {
      starburstNodesGroup = new THREE.Group();
      mainGroup.add(starburstNodesGroup);

      const starburstTex = createStarburstTexture();
      const nodeCount = 38;

      for (let i = 0; i < nodeCount; i++) {
        const ringIdx = i % orbitalRingsGroup.length;
        const t = (i / nodeCount) * Math.PI * 2.0 + (i * 0.4);

        const spriteMat = new THREE.SpriteMaterial({
          map: starburstTex,
          color: 0xffffff,
          transparent: true,
          opacity: 0.85,
          blending: THREE.AdditiveBlending
        });

        const sprite = new THREE.Sprite(spriteMat);
        const scale = 0.55 + Math.random() * 0.7;
        sprite.scale.set(scale, scale, 1.0);

        starburstNodesGroup.add(sprite);

        sprite.userData = {
          ringIdx: ringIdx,
          angle: t,
          baseScale: scale,
          pulseSpeed: 1.5 + Math.random() * 2.5
        };
      }
    }

    function buildReferenceMoonBokeh() {
      const moonGeo = new THREE.CircleGeometry(0.72, 32);
      const moonMat = new THREE.ShaderMaterial({
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec2 vUv;
          void main() {
            float dist = length(vUv - vec2(0.5));
            if (dist > 0.5) discard;
            float alpha = smoothstep(0.5, 0.1, dist) * 0.38;
            gl_FragColor = vec4(0.78, 0.88, 1.0, alpha);
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      moonBokehMesh = new THREE.Mesh(moonGeo, moonMat);
      moonBokehMesh.position.set(-11.5, -3.2, -2.0);
      mainGroup.add(moonBokehMesh);
    }

    function buildAmbientDust() {
      spaceDustGroup = new THREE.Group();
      mainGroup.add(spaceDustGroup);

      const count = 1200;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const sizes = new Float32Array(count);

      for (let i = 0; i < count; i++) {
        pos[i * 3 + 0] = (Math.random() - 0.5) * 35;
        pos[i * 3 + 1] = (Math.random() - 0.5) * 35;
        pos[i * 3 + 2] = (Math.random() - 0.5) * 25;
        sizes[i] = Math.random() * 2.5 + 0.8;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

      const mat = new THREE.PointsMaterial({
        color: 0xcfe5ff,
        size: 0.18,
        transparent: true,
        opacity: 0.35,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const dust = new THREE.Points(geo, mat);
      spaceDustGroup.add(dust);
    }

    function updateWaveManifold(time, effectiveAmp) {
      const samples = 140;

      standingWaveLines.forEach(item => {
        const u = item.u;
        const phi = Math.asin(u);
        const cosPhi = Math.cos(phi);
        const positions = item.line.geometry.attributes.position.array;

        for (let s = 0; s < samples; s++) {
          const theta = (s / (samples - 1)) * Math.PI * 2.0;

          const harmonic = Math.sin(LOBES * theta + time * 0.7) * Math.cos(3.0 * phi);
          const crossHarmonic = Math.sin(LOBES * 2.0 * theta - time * 0.4) * 0.25;
          const r = 6.2 + (harmonic + crossHarmonic) * 2.2 * effectiveAmp;

          const twist = (1.0 - Math.min(1.0, r / 7.0)) * 1.4;
          const effTheta = theta + twist * Math.sin(time * 0.5);

          positions[s * 3 + 0] = r * cosPhi * Math.cos(effTheta);
          positions[s * 3 + 1] = r * Math.sin(phi) * 0.88;
          positions[s * 3 + 2] = r * cosPhi * Math.sin(effTheta);
        }

        item.line.geometry.attributes.position.needsUpdate = true;
      });

      if (standingWaveParticles && standingWaveParticles.material.uniforms) {
        standingWaveParticles.material.uniforms.time.value = time;
        standingWaveParticles.material.uniforms.uAmp.value = effectiveAmp;
      }
    }

    function updateSimulation(dt) {
      // 1. Smooth Color Lerp
      currentColorHot.lerp(targetColorHot, 0.06);
      currentColorMid.lerp(targetColorMid, 0.06);
      currentColorDim.lerp(targetColorDim, 0.06);

      // 2. Smooth State Dynamics
      currentPositionX += (targetPositionX - currentPositionX) * 0.08;
      mainGroup.position.x = currentPositionX;

      const baseScale = isCompactMode ? (currentState === "LISTENING" ? 0.95 : 0.85) : targetScale;
      currentScale += (baseScale - currentScale) * 0.08;
      mainGroup.scale.setScalar(currentScale);

      currentCameraZ += (targetCameraZ - currentCameraZ) * 0.04;
      camera.position.z = currentCameraZ;

      currentSpeedMult += (targetSpeedMult - currentSpeedMult) * 0.06;
      currentPulseMod += (targetPulseMod - currentPulseMod) * 0.06;

      // 3. Sentient Gaze & Cursor Parallax
      mainGroup.rotation.x = Math.sin(simTime * 0.15) * 0.04 + targetTiltX;
      mainGroup.rotation.y = simTime * 0.035 * currentSpeedMult + targetTiltY;
      camera.position.x += (mouseNormX * 1.5 - camera.position.x) * 0.03;
      camera.position.y += (mouseNormY * 1.0 - camera.position.y) * 0.03;

      // 4. Smooth audio with fast attack and graceful decay
      const smoothFactor = (targetAudioLevel > currentAudioLevel) ? 0.28 : 0.08;
      currentAudioLevel += (targetAudioLevel - currentAudioLevel) * smoothFactor;

      const effectiveAmp = AMPLITUDE + currentAudioLevel * 0.22;
      const speedMult = currentSpeedMult * (1.0 + currentAudioLevel * 0.25);

      // Continuous phase integration: mathematically eliminates all speed-jump glitches
      simTime += dt * SPEED * speedMult;

      updateWaveManifold(simTime, effectiveAmp);



      // Dynamic Bloom Surge with Voice
      if (bloomPass) {
        bloomPass.strength = BLOOM_STRENGTH + currentAudioLevel * 0.70;
      }


      // 5. Apply Reactive State Colors to Shaders and Lines
      if (standingWaveParticles && standingWaveParticles.material.uniforms) {
        if (standingWaveParticles.material.uniforms.uColorHot) {
          standingWaveParticles.material.uniforms.uColorHot.value.copy(currentColorHot);
        }
        if (standingWaveParticles.material.uniforms.uColorDim) {
          standingWaveParticles.material.uniforms.uColorDim.value.copy(currentColorDim);
        }
      }

      standingWaveLines.forEach(item => {
        item.line.material.color.copy(currentColorMid);
      });

      if (coreSingularity) {
        coreSingularity.material.color.copy(currentColorHot);
        const pulse = 1.0 + Math.sin(simTime * 3.5 * currentPulseMod) * 0.12 + currentAudioLevel * 0.32;
        coreSingularity.scale.set(pulse, pulse, pulse);
      }

      if (glowSprite) {
        glowSprite.material.color.copy(currentColorHot);
        const glowPulse = 1.0 + currentAudioLevel * 0.35;
        glowSprite.scale.set(glowPulse, glowPulse, 1.0);
      }

      if (spiralMat) {
        spiralMat.color.copy(currentColorHot);
      }

      if (vortexTendrilsGroup) {
        vortexTendrilsGroup.rotation.z = simTime * 0.45;
      }

      orbitalRingsGroup.forEach((ring) => {
        ring.mesh.material.color.copy(currentColorMid);
        ring.mesh.rotation.z = ring.rot[2] + simTime * ring.speed * 0.25;
      });

      if (outerLine) {
        outerLine.material.color.copy(currentColorDim);
      }

      if (starburstNodesGroup) {
        starburstNodesGroup.children.forEach(sprite => {
          sprite.material.color.copy(currentColorHot);
          const uData = sprite.userData;
          const ring = orbitalRingsGroup[uData.ringIdx];
          if (ring) {
            uData.angle += 0.005 * ring.speed * (dt * 60.0);
            const lx = ring.rx * Math.cos(uData.angle);
            const ly = ring.ry * Math.sin(uData.angle);

            const pos = new THREE.Vector3(lx, ly, 0);
            pos.applyEuler(ring.mesh.rotation);
            sprite.position.copy(pos);

            const glint = 0.8 + Math.sin(simTime * uData.pulseSpeed * currentPulseMod + uData.angle * 3.0) * 0.35;
            const sc = uData.baseScale * glint * (1.0 + currentAudioLevel * 0.06);
            sprite.scale.set(sc, sc, 1.0);
          }
        });
      }

      // 6. Surrounding dynamic background animation
      if (spaceDustGroup) {
        spaceDustGroup.rotation.y += dt * 0.015 * currentSpeedMult;
        spaceDustGroup.rotation.x = Math.sin(simTime * 0.08) * 0.04;
        if (spaceDustGroup.children[0] && spaceDustGroup.children[0].material) {
          spaceDustGroup.children[0].material.color.copy(currentColorDim);
        }
      }

      if (moonBokehMesh) {
        moonBokehMesh.position.y = -3.2 + Math.sin(simTime * 0.45) * 0.35;
        moonBokehMesh.position.x = -11.5 + Math.cos(simTime * 0.25) * 0.25;
      }
    }

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      const dt = Math.min(clock.getDelta(), 0.05);
      
      updateSimulation(dt);

      controls.update();
      composer.render();
    }

    function onWindowResize() {
      const container = document.getElementById('webgl-canvas');
      const w = Math.max(window.innerWidth || 0, container ? container.clientWidth : 0);
      const h = Math.max(window.innerHeight || 0, container ? container.clientHeight : 0);
      if (w <= 0 || h <= 0) return;

      if (camera && renderer && composer) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();

        renderer.setSize(w, h);
        composer.setSize(w, h);
        if (bloomPass && bloomPass.resolution) {
          bloomPass.resolution.set(w, h);
        }
      }
    }

    // Bridge hooks for Python QtWebEngine & Android WebView
    window.setNIGHTFALLState = function(state) {
      if (!state) return;
      currentState = String(state).toUpperCase();
      console.log("NIGHTFALL Evo State:", currentState);

      const pal = STATE_COLORS[currentState] || STATE_COLORS.IDLE;
      targetColorHot.setHex(pal.hot);
      targetColorMid.setHex(pal.mid);
      targetColorDim.setHex(pal.dim);

      if (currentState === "LISTENING") {
        targetScale = 1.08;
        targetCameraZ = 42.0;
        targetSpeedMult = 1.35;
        targetPulseMod = 1.4;
      } else if (currentState === "THINKING") {
        targetScale = 1.04;
        targetCameraZ = 44.5;
        targetSpeedMult = 2.4;
        targetPulseMod = 1.8;
      } else if (currentState === "EXECUTING" || currentState === "WORKING") {
        targetScale = 1.10;
        targetCameraZ = 43.0;
        targetSpeedMult = 2.2;
        targetPulseMod = 2.0;
      } else if (currentState === "SPEAKING") {
        targetScale = 1.12;
        targetCameraZ = 41.5;
        targetSpeedMult = 1.8;
        targetPulseMod = 2.2;
      } else if (currentState === "MUTED") {
        targetScale = 0.88;
        targetCameraZ = 50.0;
        targetSpeedMult = 0.25;
        targetPulseMod = 0.4;
      } else if (currentState === "SCANNING") {
        targetScale = 1.06;
        targetCameraZ = 44.0;
        targetSpeedMult = 1.6;
        targetPulseMod = 1.5;
      } else if (currentState === "CINEMATIC") {
        targetScale = 0.95;
        targetCameraZ = 52.0;
        targetSpeedMult = 0.7;
        targetPulseMod = 0.8;
      } else { // IDLE / ONLINE
        currentState = "IDLE";
        targetScale = 1.0;
        targetCameraZ = 46.0;
        targetSpeedMult = 1.0;
        targetPulseMod = 1.0;
      }
    };

    window.setAudioLevel = function(level) {
      targetAudioLevel = Math.max(0.0, Math.min(1.0, parseFloat(level) || 0.0));
    };

    window.setCompactMode = function(isCompact) {
      isCompactMode = !!isCompact;
    };

    // Cinematic Reactor Controls for Setup Wizard
    window.accelerateReactor = function() {
      targetSpeedMult = 5.0;
      currentSpeedMult = 5.0;
    };

    window.triggerPulse = function() {
      currentScale = targetScale * 1.35;
      if (bloomPass) {
        bloomPass.strength = BLOOM_STRENGTH * 1.8;
        setTimeout(() => {
          bloomPass.strength = BLOOM_STRENGTH;
        }, 400);
      }
    };

    window.losePower = function() {
      targetScale = 0.6;
      targetSpeedMult = 0.1;
      if (bloomPass) bloomPass.strength = 0.15;
      setTimeout(() => {
        targetScale = 1.0;
        targetSpeedMult = 1.0;
        if (bloomPass) bloomPass.strength = BLOOM_STRENGTH;
      }, 1200);
    };

    window.setReactorSpeed = function(speed) {
      targetSpeedMult = Number(speed) || 1.0;
    };

    window.dissolveReactor = function() {
      if (bloomPass) {
        bloomPass.strength = 2.5;
        setTimeout(() => {
          bloomPass.strength = BLOOM_STRENGTH;
        }, 500);
      }
    };

    window.restorePower = function() {
      targetScale = 1.0;
      targetSpeedMult = 1.0;
      if (bloomPass) bloomPass.strength = BLOOM_STRENGTH;
    };

    window.setPointerNorm = function(nx, ny) {
      mouseNormX = nx;
      mouseNormY = ny;
      targetTiltX = -mouseNormY * 0.22;
      targetTiltY = mouseNormX * 0.30;
    };

    window.setPageCamera = function(pageIndex) {
      switch (pageIndex) {
        case 0: // Hero
          targetScale = 1.0;
          targetCameraZ = 46.0;
          targetPositionX = 0.0;
          window.setNIGHTFALLState("ONLINE");
          break;
        case 1: // Features / About
          targetScale = 1.12;
          targetCameraZ = 39.0;
          targetPositionX = 3.5;
          window.setNIGHTFALLState("SCANNING");
          break;
        case 2: // Sign In
          targetScale = 1.05;
          targetCameraZ = 41.0;
          targetPositionX = -3.2;
          window.setNIGHTFALLState("THINKING");
          break;
        case 3: // Download
          targetScale = 1.2;
          targetCameraZ = 36.0;
          targetPositionX = 4.0;
          window.setNIGHTFALLState("EXECUTING");
          break;
        case 4: // Mobile App
          targetScale = 1.08;
          targetCameraZ = 39.0;
          targetPositionX = -3.8;
          window.setNIGHTFALLState("LISTENING");
          break;
        case 5: // Setup Wizard
          targetScale = 1.04;
          targetCameraZ = 42.0;
          targetPositionX = 3.0;
          window.setNIGHTFALLState("WORKING");
          break;
        case 6: // Thanks
          targetScale = 1.0;
          targetCameraZ = 47.0;
          targetPositionX = 0.0;
          window.setNIGHTFALLState("ONLINE");
          break;
        case 7: // Feedback
          targetScale = 0.95;
          targetCameraZ = 50.0;
          targetPositionX = 0.0;
          window.setNIGHTFALLState("IDLE");
          break;
      }
    };

    function boot() {
      if (window._hasBooted) return;
      window._hasBooted = true;
      initScene();
      renderLoop();
      // Ensure layout sync after DOM updates
      setTimeout(onWindowResize, 30);
      setTimeout(onWindowResize, 150);
    }

    if (document.readyState === "complete" || document.readyState === "interactive") {
      boot();
    } else {
      document.addEventListener("DOMContentLoaded", boot);
      window.addEventListener("load", boot);
    }
  </script>
</body>
</html>
